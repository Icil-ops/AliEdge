<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);overflow:hidden;font-family:'Schibsted Grotesk',sans-serif;background:#f5f3ff;color:#17132e;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(60% 90% at 100% 0%,rgba(108,71,255,.28),transparent 60%),radial-gradient(50% 70% at 0% 100%,rgba(15,169,104,.18),transparent 60%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad)}
.brand{display:flex;align-items:center;gap:calc(var(--s)*.35);font-weight:850;font-size:calc(var(--s)*.9);letter-spacing:-.03em}
.brand img{width:calc(var(--s)*1.4);height:calc(var(--s)*1.4);margin:calc(var(--s)*-.2)}
h1{margin-top:calc(var(--s)*.35);font-size:calc(var(--s)*1.05);line-height:1;letter-spacing:-.045em;font-weight:850;max-width:var(--mw)}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(15,169,104,.32) 0)}
.tags{margin-top:calc(var(--s)*.45);display:flex;gap:calc(var(--s)*.18);flex-wrap:wrap}
.tags span{font-size:calc(var(--s)*.3);font-weight:700;padding:calc(var(--s)*.1) calc(var(--s)*.25);border-radius:999px;background:#fff;border:1px solid #e2ddf7}
.tags .g{background:#dcf7ea;color:#0fa968;border-color:#bfeed6}
.stamp{position:absolute;right:var(--pad);bottom:calc(var(--h)*.16);transform:rotate(-12deg);font-weight:850;font-size:calc(var(--s)*.5);color:#0fa968;border:3px solid #0fa968;border-radius:10px;padding:2px 14px;background:rgba(255,255,255,.7);display:var(--stamp,block)}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <div class="brand"><img src="icon-512.png" alt="">AliEdge</div>
  <h1>Sache ce qui se vend sur <em>Vinted</em> avant de commander.</h1>
  <div class="tags"><span class="g">Gratuit</span><span>AliExpress</span><span>Temu</span><span>Shein</span></div>
</div>
<div class="stamp">Vendu</div>
</body></html>

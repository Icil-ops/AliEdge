<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>AliEdge — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #06030F;
      --bg2:       #0C0618;
      --bg3:       #130D22;
      --bg4:       #1A1230;
      --border:    rgba(139,92,246,0.15);
      --border2:   rgba(139,92,246,0.22);
      --gold:      #8B5CF6;
      --gold-lt:   #C4B5FD;
      --gold-dim:  rgba(139,92,246,0.12);
      --gold-glow: rgba(139,92,246,0.30);
      --text:      #F0ECFF;
      --text-sec:  #B0A8C0;
      --text-dim:  #7A7090;
      --green:     #4caf7d;
      --green-dim: rgba(76,175,125,0.12);
      --orange:    #d4874a;
      --orange-dim:rgba(212,135,74,0.12);
      --red:       #C0392B;
      --red-dim:   rgba(192,57,43,0.12);
      --radius:    8px;
      --radius-sm: 5px;
      --font-ui:   'Space Mono', monospace;
      --font-head: 'Unbounded', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 12px;
    }

    body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* ── HEADER ─────────────── */
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      flex-wrap: wrap;
      gap: 10px;
    }
    .page-header::before {
      content: 'DASHBOARD';
      position: absolute;
      right: 0; bottom: -14px;
      font-family: var(--font-head);
      font-size: 80px;
      color: rgba(139,92,246,0.04);
      letter-spacing: 6px;
      pointer-events: none;
    }
    .brand-name {
      font-family: var(--font-head);
      font-size: 32px;
      letter-spacing: 4px;
      line-height: 1;
      color: var(--gold);
    }
    .brand-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── STATS BAR ────────────── */
    #statsBar {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      background: rgba(139,92,246,0.05);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: var(--radius-sm);
      font-size: 11px;
      color: var(--text-sec);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* ── KPIs ────────────────── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media(max-width:700px) { .kpi-row { grid-template-columns: 1fr 1fr; } }
    .kpi-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .kpi-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.3;
    }
    .kpi-val {
      font-family: var(--font-head);
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 1px;
      line-height: 1;
    }
    .kpi-lbl {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    /* ── TOOLBAR ─────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .section-title {
      font-family: var(--font-head);
      font-size: 16px;
      letter-spacing: 3px;
      color: var(--gold);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      flex: 1;
      min-width: 140px;
    }
    .search-input {
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      background: var(--bg3);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 11px;
      outline: none;
      min-width: 170px;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--text-dim); }

    .sort-btn {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      background: var(--bg3);
      color: var(--text-dim);
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .sort-btn:hover { border-color: rgba(139,92,246,0.4); color: var(--text-sec); }
    .sort-btn.active {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
    }

    /* ── HISTORY GRID ─────────── */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-fadein {
      animation: cardFadeIn 0.35s ease both;
    }

    .history-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
      transition: border-color 0.2s;
    }
    .history-card:hover { border-color: rgba(139,92,246,0.3); }
    .history-card img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      background: var(--bg3);
      display: block;
    }
    .card-img-placeholder {
      width: 100%;
      height: 80px;
      background: var(--bg3);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .history-card-title {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-card-price {
      font-family: var(--font-head);
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 0.5px;
    }
    .history-card-margin {
      font-family: var(--font-head);
      font-size: 14px;
      margin-top: 4px;
    }
    .margin-pos { color: var(--green); }
    .margin-neg { color: var(--red); }
    .margin-neu { color: var(--orange); }
    .history-card-meta {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    .score-pill {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 3px;
      padding: 2px 7px;
      font-family: var(--font-head);
      font-size: 11px;
    }
    .best-badge {
      position: absolute;
      top: 10px; right: 10px;
      background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 55%, #6B21E8 100%);
      color: #fff;
      font-family: var(--font-head);
      font-size: 9px;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 3px;
    }
    .del-btn {
      width: 100%;
      margin-top: 10px;
      padding: 5px 8px;
      background: transparent;
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 9px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      letter-spacing: 0.3px;
    }
    .del-btn:hover {
      background: var(--red-dim);
      color: var(--red);
      border-color: rgba(192,57,43,0.4);
    }

    /* ── WATCHLIST ─────────────── */
    .watchlist-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 32px;
    }
    .watchlist-table th {
      text-align: left;
      font-family: var(--font-head);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }
    .watchlist-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text);
    }
    .watchlist-table tr:hover td { background: var(--bg2); }

    /* ── BTNS ────────────────────── */
    .btn-primary {
      padding: 10px 20px;
      background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 55%, #6B21E8 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-head);
      font-size: 14px;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 2px 12px var(--gold-glow);
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline {
      padding: 7px 12px;
      background: transparent;
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: var(--radius-sm);
      color: var(--gold);
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-outline:hover { background: var(--gold-dim); }
    .btn-danger {
      padding: 7px 12px;
      background: transparent;
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: var(--radius-sm);
      color: var(--red);
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-danger:hover { background: var(--red-dim); }

    /* ── EMPTY ─────────────────── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-family: var(--font-body);
      font-size: 16px;
      grid-column: 1 / -1;
    }

    /* ── FOOTER ─────────────────── */
    .page-footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .page-footer strong { color: var(--gold); }

    @media(max-width:600px) {
      body { padding: 16px 12px 40px; }
      .kpi-row { grid-template-columns: 1fr 1fr; }
      .history-grid { grid-template-columns: 1fr; }
      .toolbar { gap: 6px; }
      .search-input { min-width: 120px; }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div>
      <div class="brand-name">ALIEDGE DASHBOARD</div>
      <div class="brand-sub">Vue d'ensemble · Historique · Watchlist</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn-outline" id="exportJsonBtn">📥 Exporter JSON</button>
      <button class="btn-outline" id="exportCsvBtn">📥 CSV complet</button>
      <button class="btn-primary" id="openPopupBtn">+ ANALYSER</button>
    </div>
  </div>

  <!-- Stats bar texte -->
  <div id="statsBar"></div>

  <!-- KPIs -->
  <div class="kpi-row" id="kpiRow">
    <div class="kpi-box"><div class="kpi-val" id="kpi-total">—</div><div class="kpi-lbl">Produits analysés</div></div>
    <div class="kpi-box"><div class="kpi-val" id="kpi-best-margin">—</div><div class="kpi-lbl">Meilleure marge</div></div>
    <div class="kpi-box"><div class="kpi-val" id="kpi-avg-score">—</div><div class="kpi-lbl">Score moyen</div></div>
    <div class="kpi-box"><div class="kpi-val" id="kpi-week-margin">—</div><div class="kpi-lbl">Marge moy. 7 jours</div></div>
  </div>

  <!-- Toolbar historique -->
  <div class="toolbar">
    <div class="section-title">HISTORIQUE DES ANALYSES</div>
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Filtrer par nom..." autocomplete="off" spellcheck="false" />
    <button class="sort-btn active" data-sort="date">↓ Date</button>
    <button class="sort-btn" data-sort="margin">↓ Marge</button>
    <button class="sort-btn" data-sort="score">↓ Score</button>
    <button class="btn-danger" id="clearHistoryBtn">🗑 Tout vider</button>
  </div>

  <!-- History grid -->
  <div class="history-grid" id="historyGrid">
    <div class="empty-state">Chargement...</div>
  </div>

  <!-- Watchlist -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);">
    <div class="section-title" style="border-bottom:none;padding-bottom:0;">WATCHLIST</div>
  </div>
  <div id="watchlistContainer">
    <div class="empty-state">Chargement...</div>
  </div>

  <div class="page-footer">BY <strong>IVAN BARA</strong> · ALIEDGE DASHBOARD · v1.2</div>

  <script src="dashboard.js"></script>
</body>
</html>

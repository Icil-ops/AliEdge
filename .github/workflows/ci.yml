name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires
        run: node --test tests/*.test.mjs
      - name: Test de bout en bout (Chromium + extension)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests/e2e.mjs shots
      - name: Paquet Chrome Web Store
        run: ./tools/pack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliedge
          path: |
            dist/*.zip
            shots/*.png

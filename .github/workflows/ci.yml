name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires
        run: node --test tests/*.test.mjs
      - name: Test de bout en bout (Chromium + extension)
        run: |
          npm install --no-save playwright@1.63.0
          # Les serveurs de paquets d'Ubuntu sont parfois injoignables (l'installation reste alors bloquée 10 minutes) :
          # 4 minutes au plus, puis Chromium seul (les bibliothèques nécessaires sont déjà sur la machine GitHub).
          timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
          set +e
          timeout 720 node tests/e2e.mjs shots > e2e.log 2>&1
          code=$?
          # Chaque ligne du journal devient une annotation lisible depuis l'API GitHub.
          tail -n 40 e2e.log | while IFS= read -r line; do echo "::notice title=e2e::${line}"; done
          exit $code
      - name: Paquet Chrome Web Store
        run: ./tools/pack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliedge
          path: |
            dist/*.zip
            shots/*.png

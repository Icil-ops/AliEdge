name: Copie vers Icil-ops/AliEdge

# Chaque push ici est recopié sur github.com/Icil-ops/AliEdge (v3 devient main là-bas).
# Secret requis dans CE dépôt : MIRROR_TOKEN, un jeton GitHub avec droit d'écriture sur Icil-ops/AliEdge.
on:
  push:
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    # Ne tourne que dans le dépôt d'origine, pas dans la copie Icil-ops/AliEdge.
    if: github.repository == 'Ivanbaraofm/Aliedge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Sinon l'identifiant du robot GitHub Actions passe avant MIRROR_TOKEN et le push est refusé.
          persist-credentials: false
      - name: Pousser vers Icil-ops/AliEdge
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=Copie::Secret MIRROR_TOKEN manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Diagnostic lisible depuis l'API (annotations) si le jeton n'a pas les bons droits.
          info=$(curl -s -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Icil-ops/AliEdge)
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Icil-ops/AliEdge)
          perms=$(echo "$info" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('permissions') or d.get('message'))" 2>/dev/null)
          scopes=$(curl -s -I -H "Authorization: Bearer $TOKEN" https://api.github.com/user | grep -i '^x-oauth-scopes' | tr -d '\r')
          echo "::notice title=Jeton::accès dépôt HTTP ${code} ; droits ${perms} ; ${scopes:-jeton fine-grained}"
          target="$BRANCH"
          [ "$BRANCH" = "v3" ] && target="main"
          if ! out=$(git push --force "https://x-access-token:${TOKEN}@github.com/Icil-ops/AliEdge.git" "HEAD:refs/heads/${target}" 2>&1); then
            echo "::error title=Copie::$(echo "$out" | tr '\n' ' ' | sed "s/${TOKEN}/***/g" | cut -c1-600)"
            exit 1
          fi
          echo "Copié : ${BRANCH} → Icil-ops/AliEdge ${target}"
      - name: Résultat de la publication Chrome Web Store
        if: github.ref_name == 'v3'
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          api="https://api.github.com/repos/Icil-ops/AliEdge"
          h=(-s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
          for i in $(seq 1 40); do
            sleep 15
            run=$(curl "${h[@]}" "$api/actions/runs?head_sha=$sha&per_page=20" | python3 -c "import sys,json;r=[x for x in json.load(sys.stdin).get('workflow_runs',[]) if x['name']=='Chrome Web Store'];print(f\"{r[0]['id']} {r[0]['status']} {r[0]['conclusion']}\" if r else '')")
            set -- $run
            [ "$2" = "completed" ] && break
          done
          [ -z "$1" ] && { echo "::warning title=Store::Aucune publication trouvée sur Icil-ops/AliEdge"; exit 0; }
          jobs=$(curl "${h[@]}" "$api/actions/runs/$1/jobs")
          echo "$jobs" | python3 -c "import sys,json;[print(f\"{s['name']}: {s['conclusion']}\") for j in json.load(sys.stdin)['jobs'] for s in j['steps']]"
          jid=$(echo "$jobs" | python3 -c "import sys,json;print(json.load(sys.stdin)['jobs'][0]['id'])")
          curl "${h[@]}" "$api/actions/jobs/$jid/logs" -L -o store.log || true
          grep -E "Manifest|Paquet|Soumis|Soumission|Examen|Rien à publier|refus|Détail|Error|échou|secrets manquants|Jeton" store.log | sed 's/^[0-9T:.Z-]* //' | head -30 | while IFS= read -r l; do echo "::notice title=Store::$l"; done
          echo "::notice title=Store::publication $3"


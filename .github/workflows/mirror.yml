name: Copie vers Icil-ops/AliEdge

# Chaque push ici est recopié sur github.com/Icil-ops/AliEdge (v3 devient main là-bas).
# Secret requis dans CE dépôt : MIRROR_TOKEN, un jeton GitHub avec droit d'écriture sur Icil-ops/AliEdge.
on:
  push:
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pousser vers Icil-ops/AliEdge
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=Copie::Secret MIRROR_TOKEN manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          target="$BRANCH"
          [ "$BRANCH" = "v3" ] && target="main"
          git push --force "https://x-access-token:${TOKEN}@github.com/Icil-ops/AliEdge.git" "HEAD:refs/heads/${target}"
          echo "Copié : ${BRANCH} → Icil-ops/AliEdge ${target}"

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>AliEdge — Comparaison produits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #06030F;
      --bg2:       #0C0618;
      --bg3:       #130D22;
      --bg4:       #1A1230;
      --border:    rgba(139,92,246,0.15);
      --border2:   rgba(139,92,246,0.22);
      --gold:      #8B5CF6;
      --gold-lt:   #C4B5FD;
      --gold-dim:  rgba(139,92,246,0.12);
      --gold-glow: rgba(139,92,246,0.30);
      --text:      #F0ECFF;
      --text-sec:  #B0A8C0;
      --text-dim:  #7A7090;
      --green:     #4caf7d;
      --green-dim: rgba(76,175,125,0.12);
      --orange:    #d4874a;
      --orange-dim:rgba(212,135,74,0.12);
      --red:       #C0392B;
      --red-dim:   rgba(192,57,43,0.12);
      --radius:    8px;
      --radius-sm: 5px;
      --font-ui:   'Space Mono', monospace;
      --font-head: 'Unbounded', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 12px;
    }

    body {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .page-header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand-name {
      font-family: var(--font-head);
      font-size: 28px;
      letter-spacing: 4px;
      color: var(--gold);
    }
    .brand-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── COMPARE GRID ─────────── */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .compare-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      transition: border-color 0.2s;
    }
    .compare-card.best-card {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(139,92,246,0.15);
    }
    .compare-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.2;
    }
    .compare-card.best-card::before {
      opacity: 0.8;
    }

    .best-label {
      position: absolute;
      top: 12px; right: 12px;
      background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 55%, #6B21E8 100%);
      color: #fff;
      font-family: var(--font-head);
      font-size: 9px;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 3px;
    }

    .card-num {
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .prod-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--bg3);
      margin-bottom: 12px;
      display: block;
    }
    .img-placeholder {
      width: 100%;
      height: 160px;
      background: var(--bg3);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 28px;
    }

    .prod-title {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text);
      margin-bottom: 12px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .data-row:last-child { border-bottom: none; }
    .data-lbl { color: var(--text-dim); }
    .data-val { color: var(--text); font-weight: 700; text-align: right; }
    .data-val.gold { color: var(--gold); }
    .data-val.green { color: var(--green); }
    .data-val.red   { color: var(--red); }

    .score-row {
      margin-top: 12px;
      padding: 10px;
      background: var(--bg3);
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .score-val {
      font-family: var(--font-head);
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 1px;
    }
    .score-lbl {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    .market-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--gold-dim);
      color: var(--gold);
      font-size: 9px;
      border: 1px solid rgba(139,92,246,0.25);
      margin-top: 4px;
    }

    /* ── EMPTY ─────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty-icon { font-size: 40px; margin-bottom: 14px; opacity: 0.5; }
    .empty-text { font-family: var(--font-body); font-size: 18px; color: var(--text-sec); margin-bottom: 8px; }
    .empty-sub { font-size: 10px; color: var(--text-dim); line-height: 1.6; }

    .btn-primary {
      padding: 10px 20px;
      background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 55%, #6B21E8 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-head);
      font-size: 13px;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 2px 12px var(--gold-glow);
      margin-top: 16px;
    }
    .btn-clear {
      padding: 8px 16px;
      background: transparent;
      color: var(--red);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: var(--radius-sm);
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 16px;
      margin-left: 10px;
    }

    .page-footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .page-footer strong { color: var(--gold); }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="brand-name">COMPARAISON PRODUITS</div>
    <div class="brand-sub">Jusqu'à 3 produits côte à côte · Meilleure marge en or</div>
    <div>
      <button class="btn-primary" id="clearBtn">🗑 VIDER LA FILE</button>
    </div>
  </div>

  <div id="compareContainer">
    <div class="empty-state">
      <div class="empty-icon">⊕</div>
      <div class="empty-text">Aucun produit à comparer</div>
      <div class="empty-sub">Clique sur "⊕ Comparer" dans le popup sur une fiche produit AliExpress<br>pour ajouter des produits à la file de comparaison (max 3).</div>
    </div>
  </div>

  <div class="page-footer">BY <strong>IVAN BARA</strong> · ALIEDGE · v1.0</div>

  <script src="compare.js"></script>
</body>
</html>
